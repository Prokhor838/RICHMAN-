      case "close": return this.close();
      case "tab": if(this.TABS.some(t=>t[0]===arg)){ this.tab = arg; this.render(); } return;
      case "give": case "take": case "set": return this.balOp(a);
      case "cfNo": return this.hideCf();
      case "cfYes": { const f = this.cb; this.hideCf(); if(f) f(); return; }
      case "apply": return this.apply();
      case "reset": return this.ask("Вернуть стандартные шансы для этого режима?", ()=>this.reset(), "Сбросить");
      case "fill": return this.fillRoulette();
    }
  },

  /* ---------- баланс ---------- */
  balOp(kind){
    const max = CONFIG.maxBalance, el = $("#admAmt");
    const raw = String(el ? el.value : "").replace(/[\s\u00a0]/g,"");
    if(!raw) return this.note("Введите количество RC", false);
    if(!/^\d+$/.test(raw)) return this.note("Допустимы только целые числа: без минуса, дробей и букв", false);
    if(raw.replace(/^0+/,"").length > 13) return this.note("Слишком большое число. Максимум: "+fmt(max), false);
    const n = Number(raw);
    if(!Number.isSafeInteger(n) || n > max) return this.note("Слишком большое число. Максимум: "+fmt(max), false);
    if(n < 1 && kind !== "set") return this.note("Сумма должна быть больше нуля", false);
    const cur = S.balance; let text, label;
    if(kind === "give"){
      if(cur >= max) return this.note("Баланс уже на максимуме", false);
      const after = Math.min(max, cur + n);
      text = `Выдать ${fmt(after-cur)} RC? Баланс: ${fmt(cur)} → ${fmt(after)}`; label = "Выдать";
    }else if(kind === "take"){
      if(n > cur) return this.note("Нельзя снять больше, чем есть на балансе ("+fmt(cur)+" RC)", false);
      text = `Снять ${fmt(n)} RC? Баланс: ${fmt(cur)} → ${fmt(cur-n)}`; label = "Снять";
    }else{
      text = `Установить баланс ${fmt(n)} RC? Сейчас: ${fmt(cur)} RC.` + (n===0 ? " При нулевом балансе сработает защита от банкротства." : "");
      label = "Установить";
    }
    this.ask(text, ()=>this.doBal(kind, n), label);
  },
  doBal(kind, n){
    const cur = S.balance, max = CONFIG.maxBalance; let msg;
    if(kind === "give"){
      const add = Math.min(n, max - cur);
      if(add < 1) return this.note("Баланс уже на максимуме", false);
      Economy.earn(add); msg = `Выдано ${fmt(add)} RC` + (add < n ? " (достигнут лимит баланса)" : "");
    }else if(kind === "take"){
      if(!Economy.spend(n)) return this.note("Не хватает RC на балансе ("+fmt(S.balance)+")", false);
      S.stats.wagered -= n; save();                        // это не ставка — статистику не искажаем
      msg = `Снято ${fmt(n)} RC`;
    }else{
      S.balance = n; ui.pulse = true; save(); Bankruptcy.soon(); msg = `Баланс установлен: ${fmt(n)} RC`;
    }
    if(ui.view !== "game") render();                       // экран игры не перерисовываем — раунд не сбрасывается
    refreshTop();
    const a = $("#admAmt"); if(a) a.value = "";
    this.note("✅ " + msg + ". Баланс: " + fmt(S.balance) + " RC", true);
  },

  /* ---------- шансы ---------- */
  slotStats(w){      // w — вероятности в % (сумма 100); возвращает {hit, rtp} в %
    let hit = 0, rtp = 0, c = 0;
    SLOT.syms.forEach((x,i)=>{ const p = w[i]/100, t = p*p*p; hit += t; rtp += t*x.p; if(x.s==="🍒") c = p; });
    const two = 3*c*c*(1-c); hit += two; rtp += two;      // ровно две вишни → возврат ставки (×1)
    return {hit:hit*100, rtp:rtp*100};
  },
  views:{
    bal(){
      return `<div class="card hero" style="margin-bottom:12px"><div class="row"><span>Текущий баланс</span><span>макс. ${fmt(CONFIG.maxBalance)}</span></div>
        <div class="big" style="margin:4px 0 0"><i class="chip lg"></i><span id="admBal" class="js-bal">${fmt(S.balance)}</span><small style="font-size:18px;color:var(--mute)">RC</small></div></div>
        <div class="card"><div class="row"><span>Количество RC (целое число)</span></div>
          <input class="adm-in" id="admAmt" type="text" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="0">
          <div class="adm-btns">
            <button class="btn" data-adm="give">➕ Выдать монеты</button>
            <button class="btn danger" data-adm="take">➖ Снять монеты</button>
            <button class="btn sec" data-adm="set">🎯 Установить баланс</button>
          </div></div>`;
    },
    slots(){
      const w = ODDS.slots.w, std = ODDS_DEFAULT.slots.w;
      return `<div class="sub" style="margin-bottom:10px">Вероятность символа на каждом барабане, %. Выплаты (×) не меняются. Если сумма не равна 100%, значения пропорционально приводятся к 100%.</div>
        <div class="card">${SLOT.syms.map(x=>`<div class="adm-row"><div class="tx"><b>${x.s} ${Admin.NAMES[x.s]}</b><small>Тройка ×${x.p} · стандарт ${fmtP(std[x.s])}%</small></div>${admIn(w[x.s],"adm-p")}</div>`).join("")}</div>
        <div class="card adm-stats" id="admStats"></div>${Admin.btns()}`;
    },
    roulette(){
      const w = ODDS.roulette.w, g = [w[0], 0, 0];
      w.forEach((v,i)=>{ if(i) g[ROU.color(i)==="red" ? 1 : 2] += v; });
      return `<div class="sub" style="margin-bottom:10px">Вероятность каждого числа 0–36, %. Выплаты (35:1, 2:1, 1:1) не меняются. Если сумма не равна 100%, значения пропорционально приводятся к 100%.</div>
        <div class="card"><b>Быстрая настройка по группам</b>
          <div class="adm-3"><label>Зеро, %${admIn(g[0],"","admG0")}</label><label>Красные, %${admIn(g[1],"","admG1")}</label><label>Чёрные, %${admIn(g[2],"","admG2")}</label></div>
          <button class="btn sec sm" style="margin-top:10px" data-adm="fill">Заполнить сетку</button>
          <div class="sub" style="font-size:13px;margin-top:6px">Распределяет вероятность поровну внутри группы. Сохраняется кнопкой «Применить».</div></div>
        <div class="card"><div class="adm-grid">${w.map((v,n)=>`<label class="adm-cell"><b class="c-${ROU.color(n)}">${n}</b>${admIn(v,"adm-p")}</label>`).join("")}</div>
          <div class="sub" style="font-size:13px;margin-top:8px">Стандарт: ${fmtP(100/37)}% на каждое число.</div></div>
        <div class="card adm-stats" id="admStats"></div>${Admin.btns()}`;
    },
    crash(){
      const c = ODDS.crash, s = ODDS_DEFAULT.crash;
      return `<div class="sub" style="margin-bottom:10px">Точка обвала выбирается при старте раунда — изменения действуют на новые раунды. Правила, авто-вывод и выплаты не меняются.</div>
        <div class="card">
          <div class="adm-row"><div class="tx"><b>Возврат игроку (RTP), %</b><small>Сейчас ${fmtP(c.rtp)}% · стандарт ${s.rtp}% · допустимо 1–100. Чем выше, тем реже ранние обвалы.</small></div>${admIn(c.rtp,"","admRtp")}</div>
          <div class="adm-row"><div class="tx"><b>Максимальный множитель обвала</b><small>Сейчас ×${fmtP(c.cap)} · стандарт ×${s.cap} · допустимо 1.01–1000</small></div>${admIn(c.cap,"","admCap")}</div>
        </div><div class="card adm-stats" id="admStats"></div>${Admin.btns()}`;
    }
  },

  /* живой предпросмотр (ничего не сохраняет) */
  live(){
    const st = $("#admStats"); if(!st) return;
    const bad = `<span class="neg">Проверьте значения</span>`;
    if(this.tab === "slots" || this.tab === "roulette"){
      const vals = [...document.querySelectorAll("#admBody .adm-p")].map(e=>admNum(e,6));
      const t = vals.reduce((a,b)=>a+b,0);
      if(!vals.every(v=>v>=0 && v<=100) || !(t>0)){ st.innerHTML = bad + " — допустимо 0–100, сумма больше 0"; return; }
      const n = vals.map(v=>v*100/t);
      let html = `Сумма: <b>${fmtP(t)}%</b>` + (Math.abs(t-100) > 1e-4 ? " — при сохранении будет приведена к 100%" : " ✓");
      if(this.tab === "slots"){
        const r = this.slotStats(n), d = this.slotStats(SLOT.syms.map(x=>ODDS_DEFAULT.slots.w[x.s]));
        html += `<br>Шанс выигрыша (любая комбинация): <b>${r.hit.toFixed(2)}%</b> (стандарт ${d.hit.toFixed(2)}%)<br>Теоретический возврат (RTP): <b>${r.rtp.toFixed(2)}%</b> (стандарт ${d.rtp.toFixed(2)}%)`;
      }else{
        let z = n[0], rd = 0, bl = 0; n.forEach((v,i)=>{ if(i) (ROU.color(i)==="red" ? rd += v : bl += v); });
        html += `<br>Зеро: <b>${z.toFixed(2)}%</b> · Красные: <b>${rd.toFixed(2)}%</b> · Чёрные: <b>${bl.toFixed(2)}%</b>`;
      }
      st.innerHTML = html;
    }else if(this.tab === "crash"){
      const rtp = admNum($("#admRtp"),2), cap = admNum($("#admCap"),2);
      if(!(rtp>=1 && rtp<=100 && cap>=1.01 && cap<=1000)){ st.innerHTML = bad + " — RTP 1–100, максимум 1.01–1000"; return; }
      const pr = x => cap >= x ? rtp/x : 0;                 // P(точка обвала ≥ x), %
      st.innerHTML = `Мгновенный обвал (×1.00): <b>${(100*(1-rtp/101)).toFixed(2)}%</b><br>Дойдёт до ×2: <b>${pr(2).toFixed(2)}%</b> · ×5: <b>${pr(5).toFixed(2)}%</b><br>×10: <b>${pr(10).toFixed(2)}%</b> · ×100: <b>${pr(100).toFixed(2)}%</b>`;
    }
  },
  fillRoulette(){
    const g = [0,1,2].map(i=>admNum($("#admG"+i),6));
    const n = Odds.normalize(g);
    if(!n) return this.note("Группы: числа от 0 до 100, сумма больше нуля", false);
    document.querySelectorAll("#admBody .adm-p").forEach((el,i)=>{
      const c = ROU.color(i), v = c==="green" ? n[0] : c==="red" ? n[1]/18 : n[2]/18;
      el.value = fmtP(v); delete el.dataset.raw; delete el.dataset.shown;
    });
    this.live(); this.note("Сетка заполнена. Нажмите «Применить», чтобы сохранить.", true);
  },
  persist(msg){
    const saved = Odds.save();
    this.render();
    this.note(saved ? "✅ " + msg : "Применено, но браузер не дал сохранить настройки — после перезапуска они пропадут", saved);
  },
  apply(){
    const tab = this.tab;
    if(tab === "slots" || tab === "roulette"){
      const vals = [...document.querySelectorAll("#admBody .adm-p")].map(e=>admNum(e,6));
      const bad = vals.findIndex(v=>!(v>=0 && v<=100));
      if(bad >= 0){
        const nm = tab==="slots" ? SLOT.syms[bad].s+" "+this.NAMES[SLOT.syms[bad].s] : "число "+bad;
        return this.note("Некорректное значение: "+nm+". Допустимо от 0 до 100, максимум 6 знаков после точки", false);
      }
      const total = vals.reduce((a,b)=>a+b,0), n = Odds.normalize(vals);
      if(!n) return this.note("Сумма вероятностей должна быть больше нуля", false);
      if(tab === "slots") SLOT.syms.forEach((x,i)=>{ ODDS.slots.w[x.s] = n[i]; });
      else ODDS.roulette.w = n;
      const norm = Math.abs(total-100) > 1e-4;
      return this.persist(norm ? `Сохранено. Сумма была ${fmtP(total)}% — приведена к 100%` : "Шансы сохранены");
    }
    if(tab === "crash"){
      const rtp = admNum($("#admRtp"),2), cap = admNum($("#admCap"),2);
      if(!(rtp>=1 && rtp<=100)) return this.note("RTP: число от 1 до 100 (до 2 знаков после точки)", false);
      if(!(cap>=1.01 && cap<=1000)) return this.note("Максимальный множитель: от 1.01 до 1000", false);
      ODDS.crash.rtp = Math.round(rtp*100)/100; ODDS.crash.cap = Math.round(cap*100)/100;
      return this.persist("Настройки Crash сохранены (для новых раундов)");
    }
  },
  reset(){
    const tab = this.tab; if(tab === "bal") return;
    ODDS[tab] = Odds.clone(ODDS_DEFAULT)[tab];
    this.persist("Стандартные шансы восстановлены");
  }
};

/* один обработчик на все кнопки; защита от двойных нажатий */
document.addEventListener("input", e=>{ if(e.target.id==="betInput") e.target.value = e.target.value.replace(/\D/g,"").slice(0,9); if(e.target.id==="crashAuto") e.target.value = e.target.value.replace(/[^0-9.,]/g,"").slice(0,7); });
document.addEventListener("change", e=>{ if(e.target.id==="betInput"){ const v = Bet.get(); if(v){ S.lastBet = Math.min(v,999999999); save(); } } });
let lastTap = 0;
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-action]");
  if(!el || el.disabled) return;
  const now = Date.now(); if(now - lastTap < 90) return; lastTap = now;
  const fn = Actions[el.dataset.action]; if(!fn) return;
  Sound.click(); haptic();
  try{ fn(el.dataset.arg); }catch(err){ console.error(err); toast("Ошибка, попробуйте ещё раз"); }
});

/* таймер ежедневной награды */
setInterval(()=>{
  const t = $("#dailyTimer"); if(!t || ui.view!=="home") return;
  const left = Daily.info().remain;
  if(left<=0){ render(); return; }
  t.textContent = fmtTime(left);
}, 1000);

/* старт */
try{
  if(tg){ tg.ready(); tg.expand(); try{ tg.setHeaderColor("#0b0b0d"); tg.setBackgroundColor("#0b0b0d"); }catch(e){} try{ tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){} }
}catch(e){}
try{ Admin.init(); }catch(e){ console.error(e); }
save();
resolvePendingOnLoad();
render();
Bankruptcy.start();
document.addEventListener("pointerdown", ()=>Sound.syncMusic(), {once:true});
</script>
